[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "armillary"
version = "0.3.1"
description = "Coordinates for a set of stellar spectra from the spectra alone, and labels for all the stars from a few labelled stars"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yuan-Sen Ting"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.12", "scikit-learn>=1.3", "numba>=0.58", "pynndescent>=0.5"]

[project.optional-dependencies]
test = ["pytest"]
tutorial = ["matplotlib", "jupyterlab"]

[project.urls]
Repository = "https://github.com/tingyuansen/armillary"

[tool.setuptools]
packages = ["armillary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: nearest-neighbour descent against the exact search on all the tutorial spectra, about 30 seconds"]
